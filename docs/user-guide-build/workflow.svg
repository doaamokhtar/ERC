<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="2000" height="952" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E716B"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B23A2E"/></marker>
  </defs>
  <rect width="1000" height="476" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#024638">Every report gets a Compliance decision, then an investigation decision</text>
  <text x="24" y="56" font-size="13" fill="#5E716B">Each decision: 2 working days · Approve and Reject each open their own screen</text>

  <!-- connectors -->
  <g fill="none" stroke="#5E716B" stroke-width="1.6">
    <path d="M196 170H252" marker-end="url(#a)"/>
    <path d="M452 170H508" marker-end="url(#a)"/>
    <path d="M708 170H782" marker-end="url(#a)"/>
    <path d="M608 214V318H664" marker-end="url(#a)"/>
    <path d="M864 296V218" marker-end="url(#a)"/>
    <path d="M352 214V318" marker-end="url(#a)"/>
  </g>
  <g fill="none" stroke="#B23A2E" stroke-width="1.6" stroke-dasharray="6 4">
    <path d="M608 126V92H352V124" marker-end="url(#r)"/>
    <path d="M764 362V440H232V200H250" marker-end="url(#r)"/>
  </g>

  <!-- boxes -->
  <g>
    <rect x="24" y="126" width="172" height="88" rx="10" fill="#EEF7F3" stroke="#36B78E" stroke-width="1.5"/>
    <text x="110" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#024638">Report submitted</text>
    <text x="110" y="180" text-anchor="middle" font-size="12.5" fill="#1D2B27">Portal, anonymous</text>
    <text x="110" y="198" text-anchor="middle" font-size="12.5" fill="#5E716B">Status: Open</text>
  </g>
  <g>
    <rect x="252" y="126" width="200" height="88" rx="10" fill="#FFFFFF" stroke="#024638" stroke-width="1.5"/>
    <text x="352" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#024638">Compliance review</text>
    <text x="352" y="178" text-anchor="middle" font-size="12.5" fill="#1D2B27">Form: Report Category</text>
    <text x="352" y="196" text-anchor="middle" font-size="12.5" fill="#5E716B">GRC-Compliance</text>
  </g>
  <g>
    <rect x="508" y="126" width="200" height="88" rx="10" fill="#FFFFFF" stroke="#024638" stroke-width="1.5"/>
    <text x="608" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#024638">Under Investigation</text>
    <text x="608" y="178" text-anchor="middle" font-size="12.5" fill="#1D2B27">Routed by category</text>
    <text x="608" y="196" text-anchor="middle" font-size="12.5" fill="#5E716B">Assigned team</text>
  </g>
  <g>
    <rect x="782" y="126" width="194" height="88" rx="10" fill="#228848" stroke="#228848" stroke-width="1.5"/>
    <text x="879" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Investigation</text>
    <text x="879" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Approved</text>
  </g>
  <g>
    <rect x="664" y="274" width="200" height="88" rx="10" fill="#FFFFFF" stroke="#36B78E" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="764" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#024638">Pending Employee</text>
    <text x="764" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#024638">Relations Approval</text>
    <text x="764" y="344" text-anchor="middle" font-size="12.5" fill="#5E716B">Retaliation only</text>
  </g>
  <g>
    <rect x="252" y="318" width="200" height="50" rx="10" fill="#FBEDEB" stroke="#B23A2E" stroke-width="1.5"/>
    <text x="352" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#B23A2E">Rejected by Compliance</text>
    <text x="352" y="358" text-anchor="middle" font-size="12" fill="#5E716B">closed, with a reason</text>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#228848" font-weight="600">
    <text x="480" y="160" text-anchor="middle">Approve</text>
    <text x="745" y="160" text-anchor="middle">Approve</text>
    <text x="745" y="190" text-anchor="middle" fill="#5E716B" font-weight="400">+ Outcome</text>
    <text x="616" y="248">HR approves</text>
    <text x="616" y="264" fill="#5E716B" font-weight="400">(Retaliation)</text>
    <text x="872" y="262">ER approves</text>
  </g>
  <g font-size="12" fill="#B23A2E" font-weight="600">
    <text x="362" y="270">Reject + reason</text>
    <text x="480" y="86" text-anchor="middle">Team rejects + reason: Back to Compliance</text>
    <text x="500" y="458" text-anchor="middle">ER rejects + reason: Back to Compliance</text>
  </g>
</svg>
