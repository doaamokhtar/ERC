# WB (Whistleblowing) workflow validator.
#
# Jira Cloud's built-in "Validate a field" can only make a field always required. This makes
# Investigating Function required only when Report Category is "Other" - the one category that
# is not routed automatically, so somebody has to choose who investigates.
#
# Expression-only: Jira evaluates it against the issue as edited on the transition screen. There
# is no function, so nothing runs outside Jira and no data leaves it.
#
#   customfield_11958  Report Category
#   customfield_12000  Investigating Function
# The ids are the same on erc-sd and erc-sd-sandbox: the sandbox was copied from production.
modules:
  jira:workflowValidator:
    - key: wb-other-requires-investigating-function
      name: WB - Investigating Function required when Report Category is Other
      description: Blocks the transition when Report Category is Other and Investigating Function is empty.
      expression: >-
        issue.customfield_11958 == null
        || issue.customfield_11958.value != "Other"
        || issue.customfield_12000 != null
      errorMessage: >-
        Investigating Function is required when Report Category is Other (see the second tab).
        | جهة التحقيق مطلوبة عند اختيار Other (في التبويب الثاني).
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/to-be-generated
permissions:
  scopes:
    - read:jira-work
